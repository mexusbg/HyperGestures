# ~300k LOC of AOSP Java/Kotlin compile in this build (build map §7.14): give both daemons room.
org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx6g
android.useAndroidX=true
kotlin.code.style=official
# Soong builds Launcher3QuickStepLib with use_resource_processor: false, so its R class carries
# every dependency's resources and the sources rely on that (build map §3.7).
android.nonTransitiveRClass=false
# KSP's incremental mode fails on Windows when the Gradle cache and the project sit on different
# drives ("this and base files have different roots: C:\...\dagger.jar!... and D:\...\modules\launcher")
# as soon as a source file is added; a full KSP pass per build avoids it.
ksp.incremental=false
# Independent modules build side by side, and task outputs are reused from the local build cache
# (a clean or a branch switch rebuilds only what changed).
org.gradle.parallel=true
org.gradle.caching=true
# The configuration is reused while the build scripts and what they read are unchanged (a full
# assembleRelease passed with it, 2026-10-31; a no-change rerun takes ~2 s).
org.gradle.configuration-cache=true
