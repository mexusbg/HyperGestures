# Pins for the AOSP modules follow docs/research/launcher3-build-map.md §1e: the exact AOSP 17
# prebuilt version where Maven publishes it, otherwise the nearest release (column
# "Recommended pin"). Tooling pins (AGP/Kotlin/KSP/protobuf plugin) are the combination Lawnchair
# 16-dev builds with today.

[versions]
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"
protobufPlugin = "0.10.0"
protobuf = "4.33.5"
junit = "4.13.2"

androidx-annotation = "1.10.0"
androidx-core = "1.19.1"
androidx-core-animation = "1.0.0"
androidx-dynamicanimation = "1.1.0"
androidx-concurrent = "1.3.0"
androidx-lifecycle = "2.11.0"
androidx-lifecycle-extensions = "2.2.0"
androidx-recyclerview = "1.4.0"
androidx-preference = "1.2.1"
androidx-fragment = "1.9.1"
androidx-slice = "1.1.0-alpha02"
androidx-cardview = "1.0.0"
androidx-window = "1.6.0-alpha03"
androidx-constraintlayout = "2.2.2"
androidx-appcompat = "1.8.0"
androidx-activity = "1.14.0-alpha01"
androidx-savedstate = "1.5.0-alpha02"
androidx-navigation = "2.10.2"
compose = "1.12.1"
compose-material3 = "1.5.0-alpha16"
compose-material-icons = "1.7.8"
androidx-graphics-shapes = "1.1.0"
androidx-appfunctions = "1.0.0-alpha08"
material = "1.14.0"
lottie = "6.5.2"
dagger = "2.60.1"
javax-inject = "1"
jsr305 = "3.0.2"
guava = "32.1.2-android"
coroutines = "1.10.2"
errorprone = "2.41.0"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }

# Gradle plugin artifacts, on buildSrc's classpath (buildSrc/build.gradle.kts).
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-compose-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
protobuf-gradle-plugin = { module = "com.google.protobuf:protobuf-gradle-plugin", version.ref = "protobufPlugin" }

androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
