# Plugin ids, for reference only. Do NOT use `alias(libs.plugins.x)` in module scripts: the
# plugin artifacts are already on buildSrc's classpath (see [libraries] above), and Gradle rejects
# a versioned request for such a plugin ("already on the classpath with an unknown version").
# Module scripts use the bare id instead, e.g. `plugins { id("com.google.devtools.ksp") }`.
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
